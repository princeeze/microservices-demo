# Cloud Armor + explicit health check for GCE Ingress (fixes UNHEALTHY backend / 502).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend-backend-config
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /
    port: 8080
  securityPolicy:
    name: online-boutique-security-policy
